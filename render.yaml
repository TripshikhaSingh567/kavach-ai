services:
  - type: web
    name: kavach-ai-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ALLOWED_ORIGINS
        value: "https://kavach-ai-vx7p.vercel.app,http://localhost:3000"
      - key: GEMINI_API_KEY
        sync: false
